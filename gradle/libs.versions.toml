[versions]
minecraft = "26.1.2"
fabric-loader = "0.19.2"
fabric-loom = "1.16-SNAPSHOT"
fabric-api = "0.148.0+26.1.2"
slf4j = "2.0.17"
log4j = "2.26.0"
jdbi = "3.53.0"
mariadb = "3.5.8"
jtoml = "1.5.2"
jspecify = "1.0.0"
junit = "6.0.3"

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-slf4j = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbi-sqlobject = { module = "org.jdbi:jdbi3-sqlobject", version.ref = "jdbi" }
jdbi-mysql = { module = "org.jdbi:jdbi3-mysql", version.ref = "jdbi" }
mariadb-connector = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
jtoml = { module = "io.github.wasabithumb:jtoml-configurate", version.ref = "jtoml" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-platform = { module = "org.junit.platform:junit-platform-suite", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[bundles]
log4j = ["log4j", "log4j-slf4j"]
junit = ["junit-platform", "junit-jupiter"]